<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web App Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Canvas */
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e5e5e5;
    background-image: radial-gradient(#cfcfcf 1px, transparent 1px);
    background-size: 20px 20px;
    color: #1a1a1a;
    overflow-x: auto;
    padding: 48px;
  }
  .canvas { display: flex; flex-direction: column; gap: 64px; width: max-content; }
  .row { display: flex; gap: 48px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; gap: 8px; }
  .item-label { font-size: 12px; color: #666; }

  /* Screen frames */
  .frame {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .frame.portrait { width: 400px; aspect-ratio: 2 / 3; }

  /* Shared UI */
  .btn {
    display: block;
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #d0d0d0;
    background: #fff;
    font: inherit;
    font-size: 15px;
    text-align: left;
    cursor: default;
  }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; text-align: center; }

  /* Sign-in */
  .signin {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px;
    gap: 32px;
  }
  .brand { text-align: center; }
  .logo {
    width: 56px; height: 56px;
    margin: 0 auto 12px;
    border-radius: 14px;
    background: #2563eb;
  }
  .brand h1 { font-size: 24px; }
  .brand p { font-size: 14px; color: #666; margin-top: 4px; }
  .roles { display: flex; flex-direction: column; gap: 12px; }
  .roles .btn strong { display: block; font-size: 15px; }
  .roles .btn span { font-size: 13px; color: #666; }
  .roles .btn.selected { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
</style>
</head>
<body>
<div class="canvas">

  <!-- Row 0 -->
  <div class="row">

    <!-- Row 0, Item 0: Sign-in -->
    <div class="item">
      <div class="item-label">0.0 Sign-in</div>
      <div class="frame portrait">
        <div class="signin">
          <div class="brand">
            <div class="logo"></div>
            <h1>LaneCount</h1>
            <p>Live vehicle counts and parking availability</p>
          </div>
          <div class="roles">
            <button class="btn selected">
              <strong>I'm a Host</strong>
              <span>Manage sensors, pools, and alerts</span>
            </button>
            <button class="btn">
              <strong>I'm a Guest</strong>
              <span>Check parking availability, no account needed</span>
            </button>
          </div>
          <button class="btn primary">Continue</button>
        </div>
      </div>
    </div>

  </div>

</div>
</body>
</html>
